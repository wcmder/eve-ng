[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-lab"
version = "0.1.0"
description = "Shared EVE-NG tooling and independent lab definitions"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "paramiko>=3.5,<5"]

[project.scripts]
eve = "eve_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
