# Management networking comes from PANORAMA_MANAGEMENT_IP, PANORAMA_NETMASK,
# PANORAMA_GATEWAY, and PANORAMA_DNS in .env.
# Administrator credentials come from PALO_USERNAME/PALO_PASSWORD in .env.
# eve init applies these commands and commits.
# Add optional Panorama configuration-mode set/delete commands below.
#
set deviceconfig system hostname panorama
set deviceconfig system service disable-ssh no
set deviceconfig system service disable-https no
