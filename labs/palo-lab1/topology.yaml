name: palo-lab1
description: Palo Alto firewall lab with Panorama
remote_folder: /

nodes:

  - name: c8kv-0
    template: c8000v
    type: qemu
    console: telnet
    image: c8000v-17.15.06
    cpu: 2
    ethernet: 8
    ram: 8192

  - name: c8kv-a
    template: c8000v
    type: qemu
    console: telnet
    image: c8000v-17.15.06
    cpu: 2
    ethernet: 4
    ram: 8192

  - name: pa-a
    template: paloalto
    type: qemu
    console: telnet
    image: paloalto-12.1.7
    cpu: 4
    ram: 12288
    ethernet: 4

  - name: pa-b
    template: paloalto
    type: qemu
    console: telnet
    image: paloalto-12.1.7
    cpu: 4
    ram: 12288
    ethernet: 4

  - name: pa-c
    template: paloalto
    type: qemu
    console: telnet
    image: paloalto-12.1.7
    cpu: 4
    ram: 12288
    ethernet: 4

  - name: pano
    template: panorama
    type: qemu
    console: telnet
    image: panorama-12.1.5
    cpu: 8
    ram: 32768
    ethernet: 4

networks:

  - name: mgmt
    type: pnet1

links:

  - node: c8kv-0
    interface: GigabitEthernet8
    network: mgmt

  - node: c8kv-a
    interface: GigabitEthernet4
    network: mgmt

  - node: pa-a
    interface: mgmt
    network: mgmt

  - node: pa-b
    interface: mgmt
    network: mgmt

  - node: pa-c
    interface: mgmt
    network: mgmt

  - node: pano
    interface: e0
    network: mgmt

  - name: c8kv0-paa
    from:
      node: c8kv-0
      interface: GigabitEthernet1
    to:
      node: pa-a
      interface: eth1/1

  - name: c8kva-paa
    from:
      node: c8kv-a
      interface: GigabitEthernet1
    to:
      node: pa-a
      interface: eth1/2
