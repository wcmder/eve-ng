name: palo-lab1
description: Palo Alto firewall lab with Panorama
remote_folder: /

nodes:

  - name: rt-0
    template: c8000v
    type: qemu
    console: telnet
    image: c8000v-17.15.06
    cpu: 2
    ethernet: 8
    ram: 8192

  - name: rt-a
    template: c8000v
    type: qemu
    console: telnet
    image: c8000v-17.15.06
    cpu: 2
    ethernet: 4
    ram: 8192

  - name: rt-b
    template: c8000v
    type: qemu
    console: telnet
    image: c8000v-17.15.06
    cpu: 2
    ethernet: 4
    ram: 8192

  - name: rt-c
    template: c8000v
    type: qemu
    console: telnet
    image: c8000v-17.15.06
    cpu: 2
    ethernet: 4
    ram: 8192

  - name: pa-a
    template: paloalto
    type: qemu
    console: telnet
    image: paloalto-12.1.7
    cpu: 4
    ram: 12288
    ethernet: 4

  - name: pa-b
    template: paloalto
    type: qemu
    console: telnet
    image: paloalto-12.1.7
    cpu: 4
    ram: 12288
    ethernet: 4

  - name: pa-c
    template: paloalto
    type: qemu
    console: telnet
    image: paloalto-12.1.7
    cpu: 4
    ram: 12288
    ethernet: 4

  - name: pano
    template: panorama
    type: qemu
    console: telnet
    image: panorama-12.1.5
    cpu: 8
    ram: 32768
    ethernet: 4

  - name: pano4
    type: qemu
    template: panorama
    image: panorama-12.1.2
    cpu: 8
    ram: 32768
    ethernet: 4
    console: telnet

networks:

  - name: mgmt
    type: pnet1

links:

  - node: rt-0
    interface: GigabitEthernet8
    network: mgmt

  - node: rt-a
    interface: GigabitEthernet4
    network: mgmt

  - node: rt-b
    interface: GigabitEthernet4
    network: mgmt

  - node: rt-c
    interface: GigabitEthernet4
    network: mgmt

  - node: pa-a
    interface: mgmt
    network: mgmt

  - node: pa-b
    interface: mgmt
    network: mgmt

  - node: pa-c
    interface: mgmt
    network: mgmt

  - node: pano
    interface: e0
    network: mgmt

  - node: pano4
    interface: e0
    network: mgmt

  - name: rt0-paa
    from:
      node: rt-0
      interface: GigabitEthernet1
    to:
      node: pa-a
      interface: eth1/1

  - name: rta-paa
    from:
      node: rt-a
      interface: GigabitEthernet1
    to:
      node: pa-a
      interface: eth1/2

  - name: rt0-pab
    from:
      node: rt-0
      interface: GigabitEthernet2
    to:
      node: pa-b
      interface: eth1/1

  - name: rtb-pab
    from:
      node: rt-b
      interface: GigabitEthernet1
    to:
      node: pa-b
      interface: eth1/2

  - name: rt0-pac
    from:
      node: rt-0
      interface: GigabitEthernet3
    to:
      node: pa-c
      interface: eth1/1

  - name: rtc-pac
    from:
      node: rt-c
      interface: GigabitEthernet1
    to:
      node: pa-c
      interface: eth1/2