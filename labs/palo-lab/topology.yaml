name: palo-lab
description: Palo Alto firewall lab with Panorama
remote_folder: /

nodes:

  - name: c8kv-0
    template: c8000v
    type: qemu
    image: c8000v-17.15.06
    cpu: 4
    ethernet: 8
    ram: 8192

  - name: c8kv-a
    template: c8000v
    type: qemu
    image: c8000v-17.15.06
    cpu: 4
    ethernet: 4
    ram: 8192

  - name: pa-a
    template: paloalto
    type: qemu
    image: paloalto-11.2.10-h6
    cpu: 2
    ram: 8192
    ethernet: 4

networks:

  - name: mgmt
    type: pnet1

links:

  - node: c8kv-0
    interface: GigabitEthernet8
    network: mgmt

  - node: c8kv-a
    interface: GigabitEthernet4
    network: mgmt

  - node: pa-a
    interface: mgmt
    network: mgmt

  - name: c8kv0-paa
    from:
      node: c8kv-0
      interface: GigabitEthernet1
    to:
      node: pa-a
      interface: eth1/1

  - name: c8kva-paa
    from:
      node: c8kv-a
      interface: GigabitEthernet1
    to:
      node: pa-a
      interface: eth1/2